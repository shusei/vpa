name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_OPTIONS: "--dns-result-order=ipv4first"

      - name: Fetch ffmpeg assets
        run: npm run fetch:ffmpeg

      - name: Run tests
        run: npm test
        env:
          CI: "true"
